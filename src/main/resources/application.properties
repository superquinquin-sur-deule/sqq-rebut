# ── Environnement ──────────────────────────────────────────────────
app.staging=true

# ── Odoo (JSON-RPC) ────────────────────────────────────────────────
odoo.url=${ODOO_URL:http://localhost:8069}
odoo.database=${ODOO_DATABASE:odoo}
odoo.login=${ODOO_LOGIN:admin}
odoo.password=${ODOO_PASSWORD:admin}
odoo.basic-auth.user=${ODOO_BASIC_AUTH_USERNAME:}
odoo.basic-auth.password=${ODOO_BASIC_AUTH_PASSWORD:}
odoo.rebut.dry-run=true
odoo.scrap.origin-id=7
odoo.scrap.location-id=12
odoo.scrap.scrap-location-id=4

# ── Rapport DLC quotidien (Brevo) ──────────────────────────────────
brevo.base-url=${BREVO_BASE_URL:https://api.brevo.com}
brevo.api-key=${BREVO_API_KEY:}
brevo.sender.email=${BREVO_SENDER_EMAIL:rebut@superquinquin.fr}
brevo.sender.name=${BREVO_SENDER_NAME:Rebut SuperQuinquin}
# Fuseau de référence du rapport : le conteneur tourne en UTC, sans cela « aujourd'hui »
# bascule à 2 h du matin heure de Paris.
report.timezone=${REPORT_TIMEZONE:Europe/Paris}
# Aucune méthode @Scheduled dans le code (le job est créé à la volée depuis les réglages) :
# sans ce forced, le scheduler ne démarre pas et Scheduler.newJob() échoue.
quarkus.scheduler.start-mode=forced

# ── Persistence ────────────────────────────────────────────────────
quarkus.datasource.db-kind=postgresql
quarkus.flyway.migrate-at-start=true
quarkus.hibernate-orm.schema-management.strategy=validate

# ── OpenAPI ────────────────────────────────────────────────────────
quarkus.smallrye-openapi.store-schema-directory=src/main/openapi
mp.openapi.extensions.smallrye.info.title=Rebut API
mp.openapi.extensions.smallrye.info.version=1.0.0
mp.openapi.extensions.smallrye.info.description=API de relevé des DLC et des Pertes de SuperQuinquin

quarkus.quinoa.ui-dir=frontend
quarkus.quinoa.build-dir=dist
quarkus.quinoa.enable-spa-routing=true
quarkus.quinoa.ignored-path-prefixes=/api,/q
quarkus.quinoa.dev-server.port=5173
%test.quarkus.quinoa.enabled=false

quarkus.http.cors.enabled=true
quarkus.http.cors.origins=http://localhost:5173

%test.odoo.rebut.dry-run=false
%test.odoo.basic-auth.user=staginguser
%test.odoo.basic-auth.password=stagingpass
%test.brevo.api-key=cle-de-test
%test.brevo.sender.email=rebut-test@superquinquin.fr

%dev.quarkus.datasource.dev-ui.allow-sql=true
